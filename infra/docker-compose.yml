name: church

services:
  proxy:
    image: caddy:2.8-alpine
    ports:
      - "${EXTERNAL_PORT:-8100}:8100"
    environment:
      # Named in the /healthz response header, and which peers may set X-Forwarded-For
      # (see the Caddyfile). Strict parsing is switched on only when a list is given.
      NODE_ID: ${NODE_ID:-main}
      TRUSTED_PROXIES: ${TRUSTED_PROXIES:-0.0.0.0/0}
      TRUSTED_PROXIES_STRICT: ${TRUSTED_PROXIES:+trusted_proxies_strict}
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - ../data/caddy:/data
      - ../data/caddy-config:/config
    depends_on:
      web:
        condition: service_healthy
      api:
        condition: service_healthy
    restart: always
    networks: [internal]

  # Bundled single-node CockroachDB. Only started with the `bundled-db`
  # profile (DB_MODE=bundled, the default); with DB_MODE=external the app
  # uses DATABASE_URL instead. See scripts/compose.sh.
  cockroach-1:
    image: cockroachdb/cockroach:v24.2.0
    profiles: [bundled-db]
    # Logs go to their own mount so they can sit on local disk when ../data is on NFS.
    # On NFS, a write stall trips cockroach's disk-stall protection -> hard-kills the node
    # (exit 137), and it can't even log why if the log sink is on the same stalled mount.
    command: ["start-single-node", "--insecure", "--advertise-addr=cockroach-1", "--log", "{file-defaults: {dir: /cockroach/logs}}"]
    volumes:
      - ../data/cockroach-1:/cockroach/cockroach-data
      # If ./data is on NFS, set COCKROACH_LOG_DIR in .env to a local-disk path.
      - ${COCKROACH_LOG_DIR:-../data/cockroach-logs}:/cockroach/logs
    ports:
      # Insecure-mode admin UI with no login: loopback only. Reach it from
      # another machine with an SSH tunnel (see INSTALL.md).
      - "127.0.0.1:${COCKROACH_UI_PORT:-8180}:8080"
    healthcheck:
      test: ["CMD", "cockroach", "sql", "--insecure", "--host=localhost", "-e", "SELECT 1"]
      interval: 5s
      timeout: 5s
      retries: 30
    restart: always
    networks: [internal]

  cockroach-init:
    image: cockroachdb/cockroach:v24.2.0
    profiles: [bundled-db]
    depends_on:
      cockroach-1:
        condition: service_healthy
    entrypoint: /bin/sh
    command:
      - "-c"
      - "cockroach sql --insecure --host=cockroach-1 -e 'CREATE DATABASE IF NOT EXISTS church'"
    restart: "no"
    networks: [internal]

  # Bundled object store (Garage, S3-compatible): only with the `bundled-s3` profile
  # (S3_MODE=bundled, the default). With S3_MODE=external the api uses S3_ENDPOINT instead.
  # See scripts/compose.sh, which derives the keys and RPC secret from AUTH_SECRET.
  garage:
    image: ${GARAGE_IMAGE:-church-garage}
    build:
      context: ./garage
    profiles: [bundled-s3]
    entrypoint: ["sh", "/usr/local/bin/garage-entrypoint.sh"]
    command: ["garage", "-c", "/tmp/garage.toml", "server"]
    environment:
      GARAGE_RPC_SECRET: ${GARAGE_RPC_SECRET:?run compose via scripts/compose.sh, or export GARAGE_RPC_SECRET}
      GARAGE_ADMIN_TOKEN: ${GARAGE_ADMIN_TOKEN:-}
      # The config is a template; these fill it in (single node: the defaults).
      GARAGE_RPC_PUBLIC_ADDR: ${GARAGE_RPC_PUBLIC_ADDR:-garage:3901}
      GARAGE_REPLICATION_FACTOR: ${GARAGE_REPLICATION_FACTOR:-1}
    volumes:
      - ./garage/garage.toml.tpl:/etc/garage.toml.tpl:ro
      - ./garage/garage-render.sh:/usr/local/bin/garage-render.sh:ro
      - ./garage/garage-entrypoint.sh:/usr/local/bin/garage-entrypoint.sh:ro
      # Metadata is an LMDB database: it must be on LOCAL disk, never NFS/SMB. If ./data is on
      # a network share, set GARAGE_META_DIR in .env to a local folder.
      - ${GARAGE_META_DIR:-../data/garage/meta}:/var/lib/garage/meta
      - ../data/garage/data:/var/lib/garage/data
    healthcheck:
      # The ports answer before the node has a role in the layout; garage-init gives it one.
      test: ["CMD-SHELL", "nc -z 127.0.0.1 3900 && nc -z 127.0.0.1 3901"]
      interval: 3s
      timeout: 3s
      retries: 30
    restart: always
    networks: [internal]

  garage-init:
    image: ${GARAGE_IMAGE:-church-garage}
    build:
      context: ./garage
    profiles: [bundled-s3]
    depends_on:
      garage:
        condition: service_healthy
    entrypoint: ["sh", "/usr/local/bin/garage-init.sh"]
    environment:
      GARAGE_RPC_SECRET: ${GARAGE_RPC_SECRET:?run compose via scripts/compose.sh, or export GARAGE_RPC_SECRET}
      GARAGE_RPC_PUBLIC_ADDR: ${GARAGE_RPC_PUBLIC_ADDR:-garage:3901}
      GARAGE_REPLICATION_FACTOR: ${GARAGE_REPLICATION_FACTOR:-1}
      GARAGE_CLUSTER: ${GARAGE_CLUSTER:-}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:?run compose via scripts/compose.sh, or export S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY:?run compose via scripts/compose.sh, or export S3_SECRET_KEY}
      S3_BUCKET: ${S3_BUCKET:-${MINIO_BUCKET:-church-files}}
    volumes:
      - ./garage/garage.toml.tpl:/etc/garage.toml.tpl:ro
      - ./garage/garage-render.sh:/usr/local/bin/garage-render.sh:ro
      - ./garage/garage-init.sh:/usr/local/bin/garage-init.sh:ro
      - ${GARAGE_META_DIR:-../data/garage/meta}:/var/lib/garage/meta
      - ../data/garage/data:/var/lib/garage/data
    restart: "no"
    networks: [internal]

  meilisearch:
    image: getmeili/meilisearch:v1.10
    environment:
      MEILI_MASTER_KEY: ${MEILI_MASTER_KEY:-dev-master-key-change-in-prod}
      MEILI_ENV: development
    volumes:
      - ../data/meili:/meili_data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:7700/health"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: always
    networks: [internal]

  api:
    # The image name can be set (`API_IMAGE`) to run an image built once elsewhere instead
    # of building on this node: every node must run the same build (docs/multi-node.md).
    image: ${API_IMAGE:-church-api}
    build:
      context: ..
      dockerfile: apps/api/Dockerfile
      args:
        BUILD_ID: ${BUILD_ID:-dev}
    # NET_RAW lets the IPAM scanner send ICMP echo (via busybox `ping`) for its
    # host sweep. Node can't open raw sockets itself; without this the scanner
    # silently falls back to its TCP-connect probe.
    cap_add:
      - NET_RAW
    env_file: ../.env
    environment:
      NODE_ENV: development
      PORT: "3001"
      # Set by scripts/compose.sh from DB_MODE/DATABASE_URL in .env (bundled
      # Cockroach, or an external YugabyteDB/CockroachDB).
      DATABASE_URL: ${DATABASE_URL:?run compose via scripts/compose.sh, or export DATABASE_URL}
      # Identity of this app node, stable across container recreates (the default
      # would be the container id). Must be unique per node in a multi-node setup;
      # see docs/multi-node.md.
      NODE_ID: ${NODE_ID:-main}
      MEILI_URL: http://meilisearch:7700
      # Set by scripts/compose.sh: the bundled Garage (keys derived from AUTH_SECRET), or
      # your S3-compatible store from .env.
      S3_ENDPOINT: ${S3_ENDPOINT:-garage:3900}
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-}
    depends_on:
      cockroach-init:
        condition: service_completed_successfully
        # Only present with the bundled-db profile (DB_MODE=bundled).
        required: false
      meilisearch:
        condition: service_healthy
      garage-init:
        condition: service_completed_successfully
        # Only present with the bundled-s3 profile (S3_MODE=bundled).
        required: false
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3001/api/v1/healthz"]
      interval: 5s
      timeout: 3s
      retries: 30
    restart: always
    networks: [internal]

  monitor:
    # The image name can be set (`MONITOR_IMAGE`) to run an image built once elsewhere instead
    # of building on this node: every node must run the same build (docs/multi-node.md).
    image: ${MONITOR_IMAGE:-church-monitor}
    build:
      context: ..
      dockerfile: services/monitor/Dockerfile
      args:
        BUILD_ID: ${BUILD_ID:-dev}
    env_file: ../.env
    environment:
      NODE_ENV: development
      # Set by scripts/compose.sh from DB_MODE/DATABASE_URL in .env (bundled
      # Cockroach, or an external YugabyteDB/CockroachDB).
      DATABASE_URL: ${DATABASE_URL:?run compose via scripts/compose.sh, or export DATABASE_URL}
      MONITOR_POLL_MS: "5000"
      MONITOR_PRUNE_DAYS: "30"
    depends_on:
      cockroach-init:
        condition: service_completed_successfully
        # Only present with the bundled-db profile (DB_MODE=bundled).
        required: false
      api:
        condition: service_healthy
    restart: always
    networks: [internal]

  web:
    # The image name can be set (`WEB_IMAGE`) to run an image built once elsewhere instead
    # of building on this node: every node must run the same build (docs/multi-node.md).
    image: ${WEB_IMAGE:-church-web}
    build:
      context: ..
      dockerfile: apps/web/Dockerfile
      args:
        BUILD_ID: ${BUILD_ID:-dev}
    env_file: ../.env
    environment:
      NODE_ENV: development
      PORT: "3000"
      HOSTNAME: "0.0.0.0"
      API_INTERNAL_URL: http://api:3001
      AUTH_TRUST_HOST: "true"
      # Set by scripts/compose.sh from DB_MODE/DATABASE_URL in .env (bundled
      # Cockroach, or an external YugabyteDB/CockroachDB).
      DATABASE_URL: ${DATABASE_URL:?run compose via scripts/compose.sh, or export DATABASE_URL}
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/api/health"]
      interval: 5s
      timeout: 3s
      retries: 30
    restart: always
    networks: [internal]

# Volumes are bind-mounted into ./data/<service>/ at the project root so a tar
# of ./data/ is a complete backup. `make init-data` creates the directories
# with the right ownership before first `make up`.

networks:
  internal:
    driver: bridge
